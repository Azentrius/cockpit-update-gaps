name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check tools (pinned in test/requirements.txt)
        run: pip install -r test/requirements.txt
      - name: Lint (shellcheck, ruff, systemd units and their hardening)
        run: make lint
      - name: Offline tests (helpers against recorded hosts, the page under jsdom, design, version)
        run: make check
      - name: Packages (.deb, .rpm) with valid AppStream data, built twice to the same bytes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm appstream > /dev/null
          appstreamcli validate --no-net packaging/*.metainfo.xml
          make packages
          (cd dist && sha256sum *.deb *.rpm) > first.sha256
          rm -rf dist && make packages > /dev/null
          (cd dist && sha256sum -c ../first.sha256)
      - name: Package dependencies name the minimum versions (Cockpit 264, Python 3.8)
        run: |
          test "$(dpkg-deb -f dist/*.deb Depends)" = "cockpit-bridge (>= 264), python3 (>= 3.8)"
          rpm -qp --requires dist/*.rpm | grep -qx 'cockpit-bridge >= 264'
          rpm -qp --requires dist/*.rpm | grep -qx 'python3 >= 3.8'
      - name: Install and remove the .deb on Debian 13
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:13 sh -ec '
            apt-get update -qq
            apt-get install -y -qq /dist/*.deb > /dev/null
            test -x /usr/lib/cockpit-update-gaps/gaps-scan.py
            test -x /usr/lib/cockpit-update-gaps/gaps-ctl.sh
            test -x /usr/lib/cockpit-update-gaps/gaps-status.py
            test -f /usr/lib/systemd/system/update-gaps-scan.timer
            test -f /usr/share/cockpit/update-gaps/manifest.json
            test -f /usr/share/metainfo/de.azentrius.update_gaps.metainfo.xml
            test "$(stat -c %a /usr/lib/cockpit-update-gaps/gapscheck.py)" = 644
            dpkg -L cockpit-update-gaps | grep -qx /usr/share/doc/cockpit-update-gaps/CC-BY-4.0-Font-Awesome.txt
            /usr/lib/cockpit-update-gaps/gaps-ctl.sh status | python3 -c "import json, sys; json.load(sys.stdin)"
            /usr/lib/cockpit-update-gaps/gaps-scan.py | python3 -c "import json, sys; d = json.load(sys.stdin); assert d[\"pm\"] == \"apt\""
            mkdir -p /var/lib/update-gaps
            /usr/lib/cockpit-update-gaps/gaps-scan.py --output /var/lib/update-gaps/scan.json --status /var/lib/update-gaps/status.json
            python3 -c "import json; argv = json.load(open(\"/usr/share/cockpit/update-gaps/manifest.json\"))[\"azentrius\"][\"status\"]; print(\" \".join(argv))" > /tmp/verb
            su nobody -s /bin/sh -c "$(cat /tmp/verb) --lang de" | python3 -c "import json, sys; d = json.load(sys.stdin); print(d[\"state\"], d[\"summary\"]); assert d[\"schema\"] == 1 and d[\"version\"] != \"unknown\""
            apt-get remove -y -qq cockpit-update-gaps > /dev/null
            test ! -e /usr/lib/cockpit-update-gaps'
      - name: Browser for the preview
        run: python -m playwright install --with-deps chromium
      - name: Preview in a browser (no JavaScript errors, no sideways scrolling on a phone) and screenshots
        run: |
          python tools/preview/build.py
          python tools/preview/shoot.py test/shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test/shots/

  # The oldest Python the helpers support (README, Requirements): the helper tests on 3.8.
  python-min:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Helper tests on Python 3.8
        run: |
          docker run --rm -v "$PWD:/src" -w /src/test python:3.8-slim sh -ec '
            python3 --version
            for t in lib_test.py scan_test.py status_test.py; do python3 "$t" > "/tmp/$t.log" 2>&1 || { cat "/tmp/$t.log"; exit 1; }; echo "PASS $t"; done'

  # The helpers on real Debian and Ubuntu systems, in throw-away containers: a held package, a
  # package without a source, a source without lists, files outside apt, a hidden folder, the
  # reboot flag, a Package-Blacklist; as root and as a user; and never apt-get from /usr/local.
  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scenario on ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src:ro" "$IMAGE" sh /src/test/scenarios.sh /src

  # The packages on more distributions: install (the package manager resolves the dependencies
  # from the distribution, the versions it took are printed), the helpers answer, removal. And two
  # systems below the minimums, which must refuse the package: Ubuntu 20.04 (Cockpit 215) and
  # Rocky Linux 8 (python3 is 3.6). The page checks only apt systems so far; on Fedora and Rocky
  # it says so, and releases of 0.1 carry no .rpm.
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", kind: deb }
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "ubuntu:26.04", kind: deb }
          - { image: "fedora:43", kind: rpm }
          - { image: "rockylinux/rockylinux:9", kind: rpm }
          - { image: "rockylinux/rockylinux:10", kind: rpm }
          - { image: "ubuntu:20.04", kind: deb, refused: "cockpit-bridge (>= 264)" }
          - { image: "rockylinux/rockylinux:8", kind: rpm, refused: "python3 >= 3.8" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
      - name: Install, check and remove on ${{ matrix.image }}
        if: ${{ !matrix.refused }}
        env:
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
        run: |
          docker run --rm -e KIND -v "$PWD/dist:/dist:ro" "$IMAGE" sh -ec '
            case "$KIND" in
              deb) apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /dist/*.deb > /dev/null
                   dpkg-query -W cockpit-bridge python3 ;;
              rpm) dnf install -y -q /dist/*.rpm
                   rpm -q cockpit-bridge python3 ;;
            esac
            python3 --version
            test -f /usr/share/cockpit/update-gaps/manifest.json
            /usr/lib/cockpit-update-gaps/gaps-ctl.sh status | python3 -c "import json, sys; json.load(sys.stdin)"
            /usr/lib/cockpit-update-gaps/gaps-scan.py > /tmp/scan.json
            python3 -c "import json; d = json.load(open(\"/tmp/scan.json\")); print(d[\"pm\"], [c[\"state\"] for c in d[\"checks\"]])"
            case "$KIND" in
              deb) apt-get remove -y -qq cockpit-update-gaps > /dev/null ;;
              rpm) dnf remove -y -q cockpit-update-gaps ;;
            esac
            test ! -e /usr/lib/cockpit-update-gaps'
      - name: ${{ matrix.image }} refuses the package (${{ matrix.refused }})
        if: ${{ matrix.refused }}
        env:
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
          REFUSED: ${{ matrix.refused }}
        run: |
          docker run --rm -e KIND -e REFUSED -v "$PWD/dist:/dist:ro" "$IMAGE" sh -c '
            case "$KIND" in
              deb) apt-get update -qq
                   DEBIAN_FRONTEND=noninteractive apt-get install -y /dist/*.deb > /tmp/out 2>&1 ;;
              rpm) dnf install -y -q /dist/*.rpm > /tmp/out 2>&1 ;;
            esac
            rc=$?
            cat /tmp/out
            if [ "$rc" = 0 ]; then echo "installed although $REFUSED is not met"; exit 1; fi
            grep -qF "$REFUSED" /tmp/out || { echo "refused, but not for $REFUSED"; exit 1; }
            test ! -e /usr/lib/cockpit-update-gaps
            echo "refused as it must be: $REFUSED"'

  # The add-on in a real Cockpit with systemd, on this throw-away runner (test/cockpit-setup.sh,
  # test/cockpit-session.py, Playwright with Chromium): installed with apt, the page in Cockpit's
  # menu, the first check by itself through the service (no network), Refresh, the regular check
  # set up and switched off from the page, a user without administrative access, no JavaScript or
  # resource errors. Versions, steps and results: the job summary and the artifact cockpit-session.
  cockpit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cockpit and the packages of this build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cockpit-ws cockpit-system cockpit-bridge rpm > /dev/null
          sudo systemctl start cockpit.socket
          make packages
          {
            echo "NEW_VERSION=$(sh tools/check-version.sh)"
            echo "NEW_DEB=$(ls "$PWD"/dist/*.deb)"
          } >> "$GITHUB_ENV"
      - name: Browser (Playwright, pinned in test/requirements.txt)
        run: |
          pip install -q -r test/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - name: Two users, a held package, the reboot flag
        run: |
          admin_pw=$(openssl rand -hex 16)
          plain_pw=$(openssl rand -hex 16)
          echo "::add-mask::$admin_pw"
          echo "::add-mask::$plain_pw"
          printf 'ADMIN_USER=ugadmin\nADMIN_PW=%s\nPLAIN_USER=ugplain\nPLAIN_PW=%s\n' "$admin_pw" "$plain_pw" >> "$GITHUB_ENV"
          sudo env ADMIN_USER=ugadmin ADMIN_PW="$admin_pw" PLAIN_USER=ugplain PLAIN_PW="$plain_pw" \
            sh test/cockpit-setup.sh >> "$GITHUB_ENV"
          for user_pw in "ugadmin:$admin_pw" "ugplain:$plain_pw"; do
            code=$(curl -sk -u "$user_pw" -o /dev/null -w '%{http_code}' https://localhost:9090/cockpit/login)
            echo "login ${user_pw%%:*}: HTTP $code"
            if [ "$code" != 200 ]; then
              sudo journalctl --no-pager -n 60 | grep -iE "cockpit|pam|auth" || true
              exit 1
            fi
          done
      - name: The add-on in Cockpit (test/cockpit-session.py)
        run: python test/cockpit-session.py cockpit-session
      - name: Report and logs
        if: always()
        run: |
          mkdir -p cockpit-session
          [ ! -f cockpit-session/report.md ] || cat cockpit-session/report.md >> "$GITHUB_STEP_SUMMARY"
          sudo journalctl --no-pager -n 2000 > cockpit-session/journal.txt || true
          sudo cat /var/lib/update-gaps/scan.json > cockpit-session/scan.json 2> /dev/null || true
      - name: Keep screenshots, report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cockpit-session
          path: cockpit-session/

  # Secrets in the files and in the whole history (gitleaks, pinned with its checksum). The
  # findings are redacted in the log; GitHub's own secret scanning with push protection runs
  # as well (repository settings).
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.21.2 over the history and the files
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --verbose .
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner .
