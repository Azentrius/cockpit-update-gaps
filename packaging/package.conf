# What tools/build-packages.sh needs to know about this package (sourced by sh).
# SPDX-License-Identifier: Apache-2.0

NAME=cockpit-update-gaps
SUMMARY="Cockpit page: the updates a server misses although Software Updates lists none"
DESCRIPTION="Shows per server where updates are missing although Cockpit's Software Updates lists none: held packages, fixes that only come with Ubuntu Pro, pending restarts, CPU vulnerabilities the kernel reports, firmware updates (with fwupd), snaps that are not refreshed, missing or old package lists, packages without a source, sources the automatic updates leave out, backports not installed, software outside the package manager and the end of support; once set up, also security issues Ubuntu has not fixed yet and fixes released upstream. For every finding it says why Software Updates does not show it and what you can do. Read only; a local service without network access writes the state, and an unprivileged one fetches the network data."
HOMEPAGE=https://github.com/Azentrius/cockpit-update-gaps
MAINTAINER="Azentrius <support@azentrius.de>"
LICENSE="Apache-2.0 AND OFL-1.1 AND CC-BY-4.0"

# One dependency per line, in each format's syntax. needrestart, ubuntu-pro-client,
# distro-info-data and fwupd are used when they are there; the page says what is missing. The minimums
# (README, Requirements): Cockpit 264 (also in plugin/manifest.json), Python 3.8.
DEB_DEPENDS="cockpit-bridge (>= 264)
python3 (>= 3.8)"
RPM_REQUIRES="cockpit-bridge >= 264
python3 >= 3.8"

# What the package owns below the staged root (directories are taken whole).
FILES="/usr/share/cockpit/update-gaps
/usr/lib/cockpit-update-gaps
/usr/lib/systemd/system/update-gaps-scan.service
/usr/lib/systemd/system/update-gaps-scan.timer
/usr/lib/systemd/system/update-gaps-radar.service
/usr/lib/systemd/system/update-gaps-radar.timer
/usr/share/metainfo/de.azentrius.update_gaps.metainfo.xml
/usr/share/doc/cockpit-update-gaps"
