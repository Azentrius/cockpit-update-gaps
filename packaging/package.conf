# What tools/build-packages.sh needs to know about this package (sourced by sh).
# SPDX-License-Identifier: Apache-2.0

NAME=cockpit-update-gaps
SUMMARY="Cockpit page: the updates a server misses although Software Updates lists none"
DESCRIPTION="Shows per server where updates are missing although Cockpit's Software Updates lists none: held packages, fixes that only come with Ubuntu Pro, pending restarts, packages dpkg left half done, too little room in /boot for the next kernel, CPU vulnerabilities the kernel reports, firmware updates (with fwupd), snaps that are not refreshed, missing or old package lists, expired signing keys of the sources, packages without a source, sources the automatic updates leave out and runs of them that failed, backports not installed, software outside the package manager and the end of support; once set up, also security issues Ubuntu has not fixed yet, fixes released upstream and newer versions elsewhere in Ubuntu. For every finding it says why Software Updates does not show it, what you can do and since when it has been there. When Ubuntu rolls updates out in phases and Software Updates fails on them, it says why and gives the commands that get around it. A finding that is meant to be there can be acknowledged until a day: the page keeps showing it, the status stops counting it. Otherwise read only; a local service without network access writes the state, and an unprivileged one fetches the network data."
HOMEPAGE=https://github.com/Azentrius/cockpit-update-gaps
MAINTAINER="Azentrius <support@azentrius.com>"
LICENSE="Apache-2.0 AND OFL-1.1 AND CC-BY-4.0"

# One dependency per line, in each format's syntax. needrestart, ubuntu-pro-client,
# distro-info-data, unattended-upgrades, gpg and fwupd are used when they are there; the page says
# what is missing. The minimums (README, Requirements): Cockpit 264 (also in plugin/manifest.json),
# Python 3.8.
DEB_DEPENDS="cockpit-bridge (>= 264)
python3 (>= 3.8)"
RPM_REQUIRES="cockpit-bridge >= 264
python3 >= 3.8"

# What the package owns below the staged root (directories are taken whole).
FILES="/usr/share/cockpit/update-gaps
/usr/lib/cockpit-update-gaps
/usr/lib/systemd/system/update-gaps-scan.service
/usr/lib/systemd/system/update-gaps-scan.timer
/usr/lib/systemd/system/update-gaps-radar.service
/usr/lib/systemd/system/update-gaps-radar.timer
/usr/share/metainfo/de.azentrius.update_gaps.metainfo.xml
/usr/share/doc/cockpit-update-gaps"
